services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pompeii-backend
    env_file:
      - ./backend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3187:3187"
      - "50087:50087"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json
      - ~/.aws:/root/.aws:ro
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pompeii-frontend
    env_file:
      - ./frontend/.env
    environment:
      - VITE_USE_POLLING=true
    ports:
      - "5187:5187"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/react-router.config.ts:/app/react-router.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    depends_on:
      - backend
    restart: unless-stopped
