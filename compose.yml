# Local development only. Production is deployed through GitHub Actions.
name: pompeii-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pompeii
      POSTGRES_USER: pompeii
      POSTGRES_PASSWORD: pompeii-local-development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pompeii-backend
    command:
      - /bin/sh
      - -c
      - npm run db:migrate && npm run start:dev
    environment:
      DATABASE_URL: postgres://pompeii:pompeii-local-development@postgres:5432/pompeii
      AUTH_MODE: test
      TEST_AUTH_SECRET: pompeii-local-browser-test-secret-change-me
      ALLOWED_ORIGINS: http://localhost:5187,http://localhost:5173
      POMPEII_COGNITO_USER_POOL_ID: us-east-1_local
      POMPEII_COGNITO_CLIENT_ID: local-browser-tests
    ports:
      - '3187:3187'
      - '50087:50087'
    volumes:
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3187/authorization/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pompeii-frontend
    env_file:
      - path: ./frontend/.env.example
      - path: ./frontend/.env
        required: false
    ports:
      - '5187:5187'
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/react-router.config.ts:/app/react-router.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
