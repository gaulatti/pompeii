name: Conventional Commits

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install commit policy dependencies
        run: npm ci

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && \
             git merge-base "$BEFORE_SHA" "$HEAD_SHA" >/dev/null; then
            npx commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          else
            git log -1 --format=%B "$HEAD_SHA" | npx commitlint --verbose
          fi
