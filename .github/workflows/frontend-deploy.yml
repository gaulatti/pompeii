name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend configuration
        env:
          VITE_API_FQDN: ${{ vars.VITE_API_FQDN }}
          VITE_FQDN: ${{ vars.VITE_FQDN }}
          VITE_LOGIN_REDIRECT_ORIGINS: ${{ vars.VITE_LOGIN_REDIRECT_ORIGINS }}
          VITE_LOGIN_REDIRECT_SCHEMES: ${{ vars.VITE_LOGIN_REDIRECT_SCHEMES }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_USER_POOL_DOMAIN: ${{ vars.VITE_USER_POOL_DOMAIN }}
        run: |
          set -eu
          required_vars="
            VITE_API_FQDN
            VITE_FQDN
            VITE_LOGIN_REDIRECT_ORIGINS
            VITE_LOGIN_REDIRECT_SCHEMES
            VITE_COGNITO_USER_POOL_ID
            VITE_COGNITO_CLIENT_ID
            VITE_USER_POOL_DOMAIN
          "

          for name in $required_vars; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing required workflow variable: $name"
              exit 1
            fi
          done

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        env:
          VITE_API_FQDN: ${{ vars.VITE_API_FQDN }}
          VITE_FQDN: ${{ vars.VITE_FQDN }}
          VITE_LOGIN_REDIRECT_ORIGINS: ${{ vars.VITE_LOGIN_REDIRECT_ORIGINS }}
          VITE_LOGIN_REDIRECT_SCHEMES: ${{ vars.VITE_LOGIN_REDIRECT_SCHEMES }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_USER_POOL_DOMAIN: ${{ vars.VITE_USER_POOL_DOMAIN }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/client/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-dist

      - name: Upload to S3
        run: |
          aws s3 rm s3://${{ vars.BUCKET_NAME }} --recursive
          aws s3 sync frontend-dist/ s3://${{ vars.BUCKET_NAME }}

      - name: Invalidate CloudFront entry point
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.DISTRIBUTION_ID }} --paths "/index.html"
